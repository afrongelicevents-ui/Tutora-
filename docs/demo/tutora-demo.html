<style>
:root{--g7:#0e6b52;--g9:#0a4f3d;--clay:#b4531a;--ochre:#e3a33b;--ink:#1c2620;--ink6:#5b665f;--paper:#fbf8f2;--mint:#e3f1ea;--line:#e6e0d6;--white:#fff;--red:#a3261b;--red0:#fbeae7;--amber0:#fdf3e1;--amber:#8a5a00;--r:12px;--tap:48px;--font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;--serif:Georgia,"Times New Roman",serif}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font:16px/1.5 var(--font);color:var(--ink);background:var(--paper)}
a{color:var(--g7)}h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0 0 10px}h1{font-size:1.75rem}h2{font-size:1.35rem}h3{font-size:1.1rem}
p{margin:0 0 12px}.muted{color:var(--ink6)}.small{font-size:.875rem}.tiny{font-size:.78rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--g7);outline-offset:2px}
.demo-bar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;padding:6px 10px 8px}
.demo-bar .tag{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;font-weight:700;letter-spacing:.02em;margin-bottom:6px}
.demo-bar .tag span:first-child{background:var(--ochre);color:var(--ink);padding:2px 8px;border-radius:99px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#2c3a32;border-radius:12px;padding:4px}
.seg button{min-height:40px;border:0;border-radius:9px;background:transparent;color:#fff;font-weight:700;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--paper);color:var(--ink)}
header.app{background:#fff;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:8px 16px;min-height:58px}
header.app img{height:24px;width:auto}
.who{font-size:.85rem;color:var(--ink6);text-align:right}
main{max-width:720px;margin:0 auto;padding:18px 16px 120px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.panel{background:var(--mint);border-radius:var(--r);padding:14px;margin-bottom:12px}
.band{background:var(--g9);color:var(--paper);border-radius:var(--r);padding:16px;margin:0 0 14px}
.band .lbl{color:var(--mint);font-size:.85rem;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats b{display:block;font-family:var(--serif);font-size:1.6rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--tap);padding:0 18px;border-radius:var(--r);border:2px solid var(--g7);background:var(--g7);color:var(--paper);font-weight:700;text-decoration:none;cursor:pointer}
.btn:hover{background:var(--g9);border-color:var(--g9)}
.btn.sec{background:#fff;color:var(--g7)}.btn.sec:hover{background:var(--mint)}
.btn.warn{background:#fff;color:var(--red);border-color:var(--red)}
.btn.block{width:100%}.btn.sm{min-height:44px;padding:0 14px;font-size:.92rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}.grow{flex:1}
.stack>*+*{margin-top:12px}
.field{display:grid;gap:4px;margin-bottom:12px}.field label,.lab{font-weight:600}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],input[type=password],select,textarea{min-height:var(--tap);padding:8px 12px;border:1.5px solid #8a948e;border-radius:10px;background:#fff;width:100%}
textarea{min-height:90px}
.hint{font-size:.85rem;color:var(--ink6)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice.three{grid-template-columns:1fr 1fr 1fr}
.choice label{display:flex;align-items:center;gap:8px;min-height:var(--tap);padding:6px 12px;border:1.5px solid #8a948e;border-radius:10px;background:#fff;font-weight:600;cursor:pointer}
.choice label:has(input:checked){border-color:var(--g7);background:var(--mint)}
.choice input{accent-color:var(--g7);width:20px;height:20px;margin:0}
.check{display:flex;gap:10px;align-items:flex-start;min-height:var(--tap);padding-top:10px}.check input{width:22px;height:22px;accent-color:var(--g7);flex:none;margin:0}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.list li:last-child{border-bottom:0}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;white-space:nowrap}
.p-wait{background:var(--amber0);color:var(--amber)}.p-ok{background:var(--mint);color:var(--g9)}.p-no{background:var(--red0);color:var(--red)}.p-info{background:#eef2f0;color:var(--ink6)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots label{display:flex;justify-content:center;align-items:center;min-height:var(--tap);border:1.5px solid #8a948e;border-radius:10px;background:#fff;font-weight:600;cursor:pointer}
.slots label:has(input:checked){border-color:var(--g7);background:var(--mint)}.slots input{position:absolute;opacity:0;pointer-events:none}
.day-h{font-weight:700;margin:14px 0 6px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.tabs button{min-height:44px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;cursor:pointer;white-space:nowrap}.tabs button[aria-pressed=true]{background:var(--g7);color:var(--paper);border-color:var(--g7)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:40;background:#fff;border-top:1px solid var(--line);display:grid;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom button{min-height:58px;border:0;background:none;font-size:.72rem;font-weight:600;color:var(--ink6);display:grid;place-items:center;gap:2px;cursor:pointer;padding:6px 2px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current=page]{color:var(--g7)}
.fab{position:fixed;right:14px;bottom:20px;z-index:30;display:inline-flex;gap:8px;align-items:center;min-height:52px;padding:0 18px 0 14px;border-radius:99px;background:var(--g7);color:var(--paper);font-weight:700;text-decoration:none;box-shadow:0 4px 12px rgb(0 0 0/.2)}
.avatar{width:84px;height:84px;border-radius:50%;background:var(--mint);border:3px solid var(--ochre);display:grid;place-items:center;font-family:var(--serif);font-size:1.9rem;color:var(--g9);flex:none}
.hero{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.subject{display:flex;justify-content:space-between;gap:8px;align-items:center}
.price{color:var(--clay);font-weight:700;white-space:nowrap}
.review{background:var(--mint);border-radius:var(--r);padding:14px;margin-bottom:10px}
.stars{color:var(--clay);letter-spacing:2px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:60;max-width:90vw;text-align:center}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-day{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:120px;padding:4px;font-size:.7rem;cursor:pointer}
.cal-day.today{border-color:var(--g7);box-shadow:inset 0 0 0 1px var(--g7)}
.cal-day .d{font-weight:700;font-size:.78rem;margin-bottom:4px;text-align:center}
.ev{border-radius:6px;padding:3px 4px;margin-bottom:3px;line-height:1.25;overflow:hidden}
.ev.on{background:var(--mint);color:var(--g9);border-left:3px solid var(--g7)}.ev.ip{background:var(--amber0);color:var(--amber);border-left:3px solid var(--ochre)}.ev.own{background:#eef2f0;color:var(--ink6);border-left:3px solid #8a948e}
.agenda .ev{font-size:.9rem;padding:10px;margin-bottom:8px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;margin:8px 0}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .l1::before{background:var(--g7)}.legend .l2::before{background:var(--ochre)}.legend .l3::before{background:#8a948e}
.steps{display:flex;gap:4px;margin-bottom:14px}.steps i{flex:1;height:6px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--g7)}
.big-opt{display:block;width:100%;text-align:left;min-height:64px;padding:12px 16px;border-radius:var(--r);border:1.5px solid #8a948e;background:#fff;margin-bottom:8px;font-weight:600;cursor:pointer}
.big-opt small{display:block;font-weight:400;color:var(--ink6)}
.big-opt[aria-pressed=true]{border-color:var(--g7);background:var(--mint)}
.receipt{background:#fff;border:1px solid var(--line);border-radius:4px;padding:22px;font-size:.92rem}
.receipt h2{font-family:var(--font);font-size:1.1rem}.receipt table{width:100%;border-collapse:collapse;margin:10px 0}.receipt td{padding:6px 0;border-bottom:1px solid var(--line)}.receipt td:last-child{text-align:right}
.room{background:#14201a;color:#fff;border-radius:var(--r);overflow:hidden}
.room-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:.85rem}
.sig{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-right:6px}.sig i{width:4px;background:#5fd4a8;border-radius:1px}.sig i.off{background:#3c4a43}
canvas.board{display:block;width:100%;height:300px;background:#fff;touch-action:none;cursor:crosshair}
.room-tools{display:flex;gap:6px;padding:8px;flex-wrap:wrap;background:#1d2b24}
.room-tools button{min-height:44px;min-width:44px;padding:0 12px;border-radius:10px;border:0;background:#2e4037;color:#fff;font-weight:600;cursor:pointer}
.room-tools button[aria-pressed=true]{background:var(--ochre);color:var(--ink)}
.room-tools .end{background:#b3261e;margin-left:auto}
.people{display:flex;gap:8px;padding:8px 12px;flex-wrap:wrap}
.person{display:flex;align-items:center;gap:6px;background:#22322a;border-radius:99px;padding:4px 10px 4px 4px;font-size:.85rem}
.person .dot{width:28px;height:28px;border-radius:50%;background:var(--g7);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.person.talk .dot{box-shadow:0 0 0 3px #5fd4a8}
.video{background:#0b1310;height:150px;display:grid;place-items:center;color:#8fa79b;font-size:.85rem}
.chat{background:#fff;color:var(--ink);padding:10px;max-height:200px;overflow:auto;font-size:.9rem}
.chat p{margin:0 0 6px}.chat b{color:var(--g9)}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid #fff}
.knock{background:var(--amber0);color:var(--amber);padding:10px 12px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.empty{text-align:center;color:var(--ink6);padding:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:.92rem}.kv dt{color:var(--ink6)}.kv dd{margin:0;font-weight:600}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.money div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 4px}.money b{display:block;font-size:1.15rem}
table.t{width:100%;border-collapse:collapse;font-size:.9rem}table.t th,table.t td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}table.t td.n,table.t th.n{text-align:right}
.preview{max-width:140px;border-radius:8px;border:1px solid var(--line)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(min-width:760px){main{padding-top:28px}.cal-day{min-height:160px;font-size:.78rem}}
@media print{.demo-bar,header.app,nav.bottom,.fab,.noprint{display:none!important}main{padding:0}.receipt{border:0}}
</style>
</head>

function freeSlots() {
	const out = []; const len = S.settings.length;
	for (let d = 1; d <= 14; d++) {
		const day = at(d, 0); const w = S.settings.weekly.filter((x) => x.day === day.getDay());
		for (const win of w) {
			const [fh, fm] = win.from.split(':').map(Number); const [th, tm] = win.to.split(':').map(Number);
			for (let t = fh * 60 + fm; t + len <= th * 60 + tm; t += len) {
				const s = at(d, Math.floor(t / 60), t % 60); const e = new Date(s.getTime() + len * 6e4);
				const clash = S.lessons.some((l) => l.status !== 'cancelled' && l.start < e && new Date(l.start.getTime() + l.mins * 6e4) > s)
					|| S.events.some((ev) => ev.start < e && new Date(ev.start.getTime() + ev.mins * 6e4) > s)
					|| S.requests.some((r) => r.status === 'requested' && +r.start === +s);
				if (!clash) out.push(s);
			}
		}
	}
	return out;
}

let roomTimer = null;
function initRoom() {
	const c = $('#board'); if (!c) return;
	const ctx = c.getContext('2d'); const dpr = window.devicePixelRatio || 1;
	const resize = () => { const w = c.clientWidth, h = c.clientHeight; c.width = w * dpr; c.height = h * dpr; ctx.scale(dpr, dpr); redraw(); };
	S.room.strokes ||= [{ c: '#0e6b52', w: 3, p: [[30, 60], [80, 60]] }];
	function redraw() { ctx.clearRect(0, 0, c.width, c.height); ctx.font = '18px Georgia'; ctx.fillStyle = '#1c2620'; ctx.fillText('x² + 5x + 6 = 0', 30, 40); for (const s of S.room.strokes) drawStroke(s); }
	function drawStroke(s) { ctx.strokeStyle = s.c === 'erase' ? '#fff' : s.c; ctx.lineWidth = s.c === 'erase' ? 18 : s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); s.p.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y))); ctx.stroke(); }
	let cur = null;
	const pt = (e) => { const r = c.getBoundingClientRect(); return [Math.round(e.clientX - r.left), Math.round(e.clientY - r.top)]; };
	c.addEventListener('pointerdown', (e) => { c.setPointerCapture(e.pointerId); cur = { c: S.room.color, w: 3, p: [pt(e)] }; S.room.strokes.push(cur); });
	c.addEventListener('pointermove', (e) => { if (!cur) return; cur.p.push(pt(e)); drawStroke(cur); S.room.mb += 0.00004; });
	c.addEventListener('pointerup', () => (cur = null));
	resize();
	clearInterval(roomTimer);
	roomTimer = setInterval(() => {
		if (!document.body.contains(c)) return clearInterval(roomTimer);
		const r = S.room; const secs = Math.floor((Date.now() - r.start) / 1000);
		r.mb += (r.mic ? 0.0035 : 0.0008) + (r.video ? 0.04 : 0);
		if (Math.random() < 0.08) r.q = Math.max(1, Math.min(3, r.q + (Math.random() < 0.5 ? -1 : 1)));
		$('#rtime').textContent = `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`;
		$('#rmb').textContent = r.mb.toFixed(1); $('#rq').textContent = ['', 'Weak connection', 'OK connection', 'Good connection'][r.q];
		document.querySelectorAll('.sig i').forEach((el, i) => el.classList.toggle('off', i >= r.q));
	}, 1000);
}

/* ---------- actions ---------- */
function makeICS(l) {
	const f = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
	return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Tutora//Demo//EN', 'BEGIN:VEVENT', `UID:lesson-${l.id}@tutora.demo`, `DTSTAMP:${f(new Date())}`, `DTSTART:${f(l.start)}`, `DTEND:${f(new Date(l.start.getTime() + l.mins * 6e4))}`, `SUMMARY:${l.subject} lesson (Tutora)`, `DESCRIPTION:${l.mode === 'online' ? 'Online: open Tutora and tap Join room.' : 'In person.'}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
}
function confirmPayment(p) {
	p.status = 'confirmed'; p.confirmedAt = new Date(); p.receipt = 'R-' + String(++receiptNo).padStart(6, '0');
	if (!p.covers.length) p.covers = S.lessons.filter((l) => l.students.includes(p.student)).slice(0, Math.max(1, Math.round(p.amount / 800))).map((l) => `${l.subject}, ${fmtDay(l.start)}`);
}
document.addEventListener('click', (e) => {
	const t = e.target.closest('[data-go],[data-act],[data-role]'); if (!t) return;
	if (t.dataset.role) return setRole(t.dataset.role);
	const a = t.dataset.act; const id = +t.dataset.id;
	if (t.tagName === 'A' || t.dataset.go) e.preventDefault();
	if (t.dataset.intro) S.booking = { subject: 'Intro chat', mode: 'online', intro: true };
	else if (t.dataset.go === 'book') S.booking = { subject: '', mode: 'online', intro: false };
	if (a) {
		const r = S.room;
		switch (a) {
			case 'as-student': return setRole('student'), go('book');
			case 'as-visitor': S.role = 'visitor'; document.querySelectorAll('.seg button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.role === 'visitor'))); return go('home');
			case 'see-tutor': setRole('tutor'); return go('t-today');
			case 'wa': return toast(`Opens WhatsApp chat with ${S.settings.whatsapp || 'the tutor'} (needs internet).`);
			case 'wa-remind': { const l = S.lessons.find((x) => x.id === id); return toast(`WhatsApp opens with: “Reminder: ${l.subject} lesson today at ${fmtTime(l.start)}.”`); }
			case 'stab': S.studentTab = t.dataset.v; return render();
			case 'ptab': S.payTab = t.dataset.v; return render();
			case 'ics': if (embedded) return toast('In the real app this adds the lesson to your phone calendar.'); return download('tutora-lesson.ics', 'text/calendar', makeICS(S.lessons.find((l) => l.id === id))), toast('Calendar file downloaded. Open it to add the lesson.');
			case 'cancel': S.lessons.find((l) => l.id === id).status = 'cancelled'; toast('Lesson cancelled. The tutor has been told.'); return render();
			case 'accept-prop': { const q = S.requests.find((x) => x.id === id); q.status = 'accepted'; S.lessons.push({ id: nid(), students: [q.student], subject: q.subject, start: q.proposed, mins: 60, mode: q.mode, status: 'scheduled' }); toast('Booked!'); return render(); }
			case 'decline-prop': S.requests.find((x) => x.id === id).status = 'declined'; return render();
			case 'req-accept': { const q = S.requests.find((x) => x.id === id); q.status = 'accepted'; S.lessons.push({ id: nid(), students: [q.student], subject: q.subject, start: q.start, mins: 60, mode: q.mode, status: 'scheduled' }); S.charges[q.student] = (S.charges[q.student] || 0) + 800; toast('Accepted. The student gets an email, and it’s in your calendar.'); return render(); }
			case 'req-decline': S.requests.find((x) => x.id === id).status = 'declined'; toast('Declined. The student has been told.'); return render();
			case 'req-propose': { const q = S.requests.find((x) => x.id === id); q.status = 'proposed'; q.proposed = new Date(q.start.getTime() + DAY); toast(`Suggested ${fmtDay(q.proposed)} ${fmtTime(q.proposed)} instead.`); return render(); }
			case 'pay-ok': { const p = S.payments.find((x) => x.id === id); confirmPayment(p); toast(`Confirmed. Receipt ${p.receipt} sent to both of you.`); return render(); }
			case 'pay-no': { const p = S.payments.find((x) => x.id === id); p.status = 'rejected'; p.reason = 'Reference not found'; toast('Rejected (reason: reference not found). The student has been told.'); return render(); }
			case 'cal-view': S.calView = t.dataset.v; return render();
			case 'cal-move': S.calDay = new Date(S.calDay.getTime() + (+t.dataset.v) * (S.calView === 'week' ? 7 : 1) * DAY); return render();
			case 'cal-today': S.calDay = new Date(today0); return render();
			case 'cal-pick': S.calDay = new Date(t.dataset.d); S.calView = 'day'; return render();
			case 'csv': { const rows = [['Student', 'Paid', 'Waiting', 'Owed'], ...S.students.map((s) => [s.name, paidBy(s.id) / 100, waitingBy(s.id) / 100, owedBy(s.id) / 100])]; if (embedded) return toast('In the real app this downloads a spreadsheet (CSV).'); download('tutora-payments.csv', 'text/csv', rows.map((r) => r.join(',')).join('\n')); return toast('CSV downloaded.'); }
			case 'record-cash': { const sid = S.students[2].id; const p = { id: nid(), student: sid, amount: 800, method: 'Cash', ref: '', date: new Date(), status: 'waiting', covers: [] }; S.payments.push(p); confirmPayment(p); toast(`Cash recorded for ${student(sid).name}. Receipt ${p.receipt}.`); return render(); }
			case 'rev-toggle': { const rv = S.reviews.find((x) => x.id === id); rv.hidden = !rv.hidden; return render(); }
			case 'wiz': S.wizard = Math.max(0, Math.min(WIZ.length - 1, S.wizard + +t.dataset.v)); return render(), window.scrollTo(0, 0);
			case 'wiz-jump': S.wizard = +t.dataset.v; return go('t-wizard');
			case 'wiz-set': S.settings[t.dataset.k] = t.dataset.k === 'showPrices' ? t.dataset.v === '1' : t.dataset.v; return render();
			case 'cur': S.settings.currency = t.dataset.v; return;
			case 'show-prices': S.settings.showPrices = t.checked; return;
			case 'toast': return toast(t.dataset.msg);
			case 'fake-file': return toast(`${t.dataset.name} would open here (private link that expires in 10 minutes).`);
			case 'print': if (embedded) return toast('In the real app this downloads the PDF receipt.'); return window.print();
			case 'room-admit': r.knocking = false; r.chat.push({ who: 'Tutora', text: 'Rudo joined.' }); return render();
			case 'room-admit-me': r.admitted = true; r.chat.push({ who: 'Tutora', text: 'You joined. Audio only (saves data).' }); return render();
			case 'pen': r.color = t.dataset.v; return document.querySelectorAll('[data-act=pen]').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
			case 'board-clear': r.strokes = []; return initRoom();
			case 'mic': r.mic = !r.mic; return render();
			case 'video': r.video = !r.video; return render();
			case 'share': r.share = !r.share; return render();
			case 'leave': clearInterval(roomTimer); S.room = null; toast('You left the lesson.'); return go(HOME[S.role]);
		}
	}
	if (t.dataset.go) go(t.dataset.go);
});
document.addEventListener('submit', (e) => {
	const f = e.target; const kind = f.dataset.form; if (!kind) return; e.preventDefault();
	const fd = new FormData(f);
	switch (kind) {
		case 'signup': toast('Demo: account created. Check your email for the link.'); return setRole('student');
		case 'book': { const b = S.booking; b.subject = b.intro ? 'Intro chat' : fd.get('subject'); b.mode = fd.get('mode'); b.slot = fd.get('slot'); S.requests.push({ id: nid(), student: S.me, subject: b.subject, start: new Date(b.slot), mode: b.mode, note: fd.get('note') || '', status: 'requested' }); return go('book:sent'); }
		case 'pay': { const img = $('#py-prev'); const p = { id: nid(), student: S.me, amount: Math.round(parseFloat(fd.get('amount')) * 100), method: fd.get('method'), ref: fd.get('ref'), date: new Date(fd.get('date')), status: 'waiting', proof: true, proofImg: img && !img.hidden ? img.src : null, covers: [] }; S.payments.push(p); S.payTab = 'history'; toast('Sent. Status: waiting for tutor. Switch to Tutor to confirm it.'); return render(); }
		case 'cash': S.payments.push({ id: nid(), student: S.me, amount: Math.round(parseFloat(fd.get('amount')) * 100), method: 'Cash', ref: '', date: new Date(fd.get('date')), status: 'waiting', covers: [] }); S.payTab = 'history'; toast('Thanks. The tutor will confirm your cash payment.'); return render();
		case 'review': S.reviews.unshift({ id: nid(), who: student(S.me).name.split(' ')[0] + ', Form 4', stars: +fd.get('stars'), text: fd.get('text'), hidden: false }); toast('Thank you! Your review is on the public page.'); return render();
		case 'hw': { const h = S.homework.find((x) => x.id === +f.dataset.id); const file = f.querySelector('input[type=file]').files[0]; h.answer = { file: file ? file.name : 'answer.jpg', at: new Date() }; toast('Handed in. The tutor can see it now.'); return render(); }
		case 'event': { const [y, mo, d] = fd.get('date').split('-').map(Number); const [h, mi] = fd.get('time').split(':').map(Number); S.events.push({ id: nid(), title: fd.get('title'), start: new Date(y, mo - 1, d, h, mi), mins: 60 }); toast('Added to your calendar.'); return render(); }
		case 'note': S.notes[+f.dataset.id] = fd.get('note'); return toast('Note saved. Only you can see it.');
		case 'give-hw': S.homework.push({ id: nid(), student: +f.dataset.id, title: fd.get('title'), note: fd.get('note') || '', due: at(3, 0), file: null, answer: null }); toast('Homework sent. The student gets an email.'); return render();
		case 'chat': { const v = String(fd.get('text') || '').trim(); if (!v) return; S.room.chat.push({ who: S.role === 'tutor' ? 'You' : 'You', text: v }); render(); setTimeout(() => { if (!S.room) return; S.room.chat.push({ who: S.role === 'tutor' ? 'Rudo' : 'Tutor', text: S.role === 'tutor' ? 'Okay, thank you!' : 'Good. Now try question 3 on the board.' }); if ($('#chat')) { render(); $('#chat').scrollTop = 1e6; } }, 1200); return; }
		case 'room-file': { const file = f.querySelector('input[type=file]').files[0]; S.room.files.push(file ? file.name : 'photo.jpg'); toast('Shared with everyone in the lesson.'); return render(); }
	}
});
document.addEventListener('change', (e) => {
	const t = e.target;
	if (t.id === 'py-f' && t.files[0] && t.files[0].type.startsWith('image/')) {
		// same idea as the real app: shrink on the phone and drop hidden photo data before upload
		const img = new Image(); img.onload = () => { const s = Math.min(1, 1200 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); const out = c.toDataURL('image/jpeg', 0.7); const p = $('#py-prev'); p.src = out; p.hidden = false; const before = t.files[0].size, after = Math.round(out.length * 0.75); if (after < before) toast(`Photo made smaller: ${Math.round(before / 1024)} KB → ${Math.round(after / 1024)} KB, location data removed`); URL.revokeObjectURL(img.src); }; img.src = URL.createObjectURL(t.files[0]);
	}
	if (t.id === 'su-u18') $('#su-par').hidden = !t.checked;
	if (t.dataset.set) { S.settings[t.dataset.set] = t.type === 'number' ? +t.value : t.value; }
});
document.addEventListener('input', (e) => {
	if (e.target.dataset.act === 'search') { const q = e.target.value.toLowerCase(); document.querySelectorAll('#st-list li').forEach((li) => (li.hidden = !li.dataset.name.includes(q))); }
});
render();
</script>
