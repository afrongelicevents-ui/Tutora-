<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>%sveltekit.status% · Tutora</title>
		<style>
			body {
				margin: 0;
				min-height: 100vh;
				display: grid;
				place-items: center;
				font-family:
					system-ui,
					-apple-system,
					'Segoe UI',
					Roboto,
					sans-serif;
				color: #0b2545;
				background: linear-gradient(160deg, #eef4fb, #f8fbff 60%, #fdf7ee);
			}
			main {
				max-width: 26rem;
				margin: 1.5rem;
				padding: 2rem 1.6rem;
				border-radius: 22px;
				background: rgba(255, 255, 255, 0.85);
				box-shadow: 0 10px 30px rgba(11, 37, 69, 0.08);
				text-align: center;
			}
			.mark {
				font-family: Georgia, 'Times New Roman', serif;
				font-size: 1.6rem;
				font-weight: 700;
			}
			h1 {
				font-family: Georgia, 'Times New Roman', serif;
				font-size: 1.4rem;
				margin: 1rem 0 0.5rem;
			}
			p {
				margin: 0 0 1.4rem;
				color: #3b5070;
			}
			a.btn {
				display: inline-block;
				padding: 0.75rem 1.4rem;
				border-radius: 999px;
				background: #0b2545;
				color: #fff;
				text-decoration: none;
				font-weight: 600;
			}
		</style>
	</head>
	<body>
		<main>
			<div class="mark">Tutora</div>
			<h1>This page isn't available (%sveltekit.status%)</h1>
			<p>It may have moved, or it isn't yours to see. (%sveltekit.error.message%)</p>
			<a class="btn" href="/">Back to Tutora</a>
		</main>
	</body>
</html>
