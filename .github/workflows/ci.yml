name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tutora
          POSTGRES_PASSWORD: tutora
          POSTGRES_DB: tutora_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tutora" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://tutora:tutora@localhost:5432/tutora_test
      # dummy values so the app can be type-checked and built
      DATABASE_URL: postgres://tutora:tutora@localhost:5432/tutora_test
      ORIGIN: http://localhost:5173
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      TUTOR_EMAIL: tutor@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
