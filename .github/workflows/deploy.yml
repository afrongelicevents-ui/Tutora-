name: Deploy

# Puts the site online with only two repository secrets:
#   NEON_API_KEY          finds the database (or creates one), runs migrations
#   CLOUDFLARE_API_TOKEN  finds the account, creates the free workers.dev address, deploys
# (DATABASE_URL and CLOUDFLARE_ACCOUNT_ID also work instead, if you prefer.)
# Optional: Connected Tools secrets (GOOGLE_*, MS_*, TOOLS_KEY), see docs/CONNECTED-TOOLS.md.
# Everything personal (name, email, prices, WhatsApp, ...) is entered by the tutor on the site.
# Runs after CI passes on main, or by hand (Actions → Deploy → Run workflow).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      reset_db_password:
        description: 'Reset the database password first (if it was ever shared)'
        type: boolean
        default: false
      new_setup_code:
        description: 'Make a new owner setup code (replaces an unused one)'
        type: boolean
        default: false
      reset_test_data:
        description: 'TEST site: wipe it and fill it with fresh fake data'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy code that was pushed to main in this repository (never a fork's pull request,
    # even one whose branch is also called "main"). Manual runs only from main.
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check secrets are set
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON: ${{ secrets.NEON_API_KEY }}
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$CF" ] || { [ -z "$NEON" ] && [ -z "$DB" ]; }; then
            msg="Not deployed yet: add the repository secrets NEON_API_KEY and CLOUDFLARE_API_TOKEN (docs/DEPLOY.md), then run this workflow again."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
            echo "::notice::$msg"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.ready == 'true'

      - name: Find the database
        if: steps.check.outputs.ready == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          DB: ${{ secrets.DATABASE_URL }}
          RESET_PASSWORD: ${{ inputs.reset_db_password && 'true' || 'false' }}
        run: |
          if [ -n "$NEON_API_KEY" ]; then
            node scripts/deploy/neon.mjs
          else
            clean=$(node -e 'const u=new URL(process.argv[1].trim());u.searchParams.delete("channel_binding");console.log(u.toString())' "$DB")
            echo "::add-mask::$clean"
            echo "DATABASE_URL=$clean" >> "$GITHUB_ENV"
          fi

      - name: Prepare Cloudflare
        id: cf
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy/cloudflare.mjs

      - name: Prepare app secrets
        if: steps.check.outputs.ready == 'true'
        env:
          AUTH: ${{ secrets.BETTER_AUTH_SECRET }}
          CRON: ${{ secrets.CRON_SECRET }}
        run: |
          # No separate secrets needed: derive stable ones from the (secret) database address.
          if [ -z "$AUTH" ]; then AUTH=$(printf 'tutora-auth:%s' "$DATABASE_URL" | sha256sum | cut -d' ' -f1); fi
          if [ -z "$CRON" ]; then CRON=$(printf 'tutora-cron:%s' "$DATABASE_URL" | sha256sum | cut -d' ' -f1); fi
          echo "::add-mask::$AUTH"
          echo "::add-mask::$CRON"
          { echo "BETTER_AUTH_SECRET=$AUTH"; echo "CRON_SECRET=$CRON"; } >> "$GITHUB_ENV"

      - name: Prepare the database tables
        if: steps.check.outputs.ready == 'true'
        run: pnpm db:migrate

      - name: Make the one-time owner setup code
        if: steps.check.outputs.ready == 'true'
        env:
          NEW_SETUP_CODE: ${{ inputs.new_setup_code && 'true' || 'false' }}
        # Prints the code only encrypted (see scripts/deploy/setup-code.mjs).
        run: node scripts/deploy/setup-code.mjs

      - run: pnpm build
        if: steps.check.outputs.ready == 'true'

      - name: Prepare optional Connected Tools secrets
        if: steps.check.outputs.ready == 'true'
        # Google / Microsoft OAuth apps (docs/CONNECTED-TOOLS.md). Only the NAMES of the ones
        # that are set are passed on; empty ones are left out so wrangler does not fail.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          TOOLS_KEY: ${{ secrets.TOOLS_KEY }}
        run: |
          {
            echo "TOOL_SECRETS<<TOOL_SECRETS_END"
            for n in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_API_KEY GOOGLE_APP_ID MS_CLIENT_ID MS_CLIENT_SECRET TOOLS_KEY; do
              if [ -n "${!n}" ]; then echo "$n"; fi
            done
            echo "TOOL_SECRETS_END"
          } >> "$GITHUB_ENV"

      - uses: cloudflare/wrangler-action@v3
        if: steps.check.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            DATABASE_URL
            BETTER_AUTH_SECRET
            CRON_SECRET
            ${{ env.TOOL_SECRETS }}
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          TOOLS_KEY: ${{ secrets.TOOLS_KEY }}

      - name: Check the website answers
        if: steps.check.outputs.ready == 'true'
        run: |
          # A brand-new workers.dev address can take a minute or two to start working.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          setup=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/setup" || true)
          echo "Home page: HTTP $code · /setup: HTTP $setup"
          {
            echo "## Tutora is online"
            echo ""
            echo "Website: $SITE_URL"
            echo ""
            echo "The owner sets up their account at $SITE_URL/setup with the one-time setup code."
            echo ""
            echo "Home page answered HTTP $code."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SITE: $SITE_URL"
          [ "$code" = "200" ] || { echo "::warning::The site did not answer 200 yet (got $code). It may need another minute."; }

  # The TEST site: same code, its own database branch ("test") and Worker ("tutora-test"),
  # full of fake data. Never touches the live database.
  deploy-test:
    needs: deploy
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Check secrets are set
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -z "$CF" ] || [ -z "$NEON" ]; then
            echo "::notice::Test site skipped: it needs NEON_API_KEY and CLOUDFLARE_API_TOKEN."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.ready == 'true'
      - name: Find (or make) the test database branch
        if: steps.check.outputs.ready == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH: test
        run: node scripts/deploy/neon.mjs
      - name: Prepare Cloudflare
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: tutora-test
        run: node scripts/deploy/cloudflare.mjs
      - name: Prepare app secrets
        if: steps.check.outputs.ready == 'true'
        run: |
          AUTH=$(printf 'tutora-test-auth:%s' "$DATABASE_URL" | sha256sum | cut -d' ' -f1)
          CRON=$(printf 'tutora-test-cron:%s' "$DATABASE_URL" | sha256sum | cut -d' ' -f1)
          # shared password of the fake test logins (only ever shown encrypted below)
          TPW="Test-$(printf 'tutora-test-pw:%s' "$DATABASE_URL" | sha256sum | cut -c1-10)"
          echo "::add-mask::$AUTH"
          echo "::add-mask::$CRON"
          echo "::add-mask::$TPW"
          { echo "BETTER_AUTH_SECRET=$AUTH"; echo "CRON_SECRET=$CRON"; echo "TEST_PASSWORD=$TPW"; } >> "$GITHUB_ENV"
      - name: Prepare the database tables
        if: steps.check.outputs.ready == 'true'
        run: |
          TEST_SITE=1 node scripts/deploy/reset-test-schema.mjs
          pnpm db:migrate
      # Fake data goes in BEFORE the test website goes live: a new branch (or anything that is
      # not our fake data) is always wiped first, so real data can never be served there.
      - name: Fill the test database with fake data
        if: steps.check.outputs.ready == 'true'
        env:
          RESET: ${{ inputs.reset_test_data && 'true' || 'false' }}
        run: |
          IF_EMPTY=1
          if [ "$RESET" = "true" ] || [ "$TEST_BRANCH_NEW" = "true" ]; then IF_EMPTY=0; fi
          IF_EMPTY=$IF_EMPTY TEST_SITE=1 node_modules/.bin/tsx scripts/deploy/seed-test.ts
      - run: pnpm build
        if: steps.check.outputs.ready == 'true'
      - name: Prepare optional Connected Tools secrets
        if: steps.check.outputs.ready == 'true'
        # Google / Microsoft OAuth apps (docs/CONNECTED-TOOLS.md). Only the NAMES of the ones
        # that are set are passed on; empty ones are left out so wrangler does not fail.
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          TOOLS_KEY: ${{ secrets.TOOLS_KEY }}
        run: |
          {
            echo "TOOL_SECRETS<<TOOL_SECRETS_END"
            for n in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_API_KEY GOOGLE_APP_ID MS_CLIENT_ID MS_CLIENT_SECRET TOOLS_KEY; do
              if [ -n "${!n}" ]; then echo "$n"; fi
            done
            echo "TOOL_SECRETS_END"
          } >> "$GITHUB_ENV"

      - uses: cloudflare/wrangler-action@v3
        if: steps.check.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          environment: test
          command: deploy --env test
          secrets: |
            DATABASE_URL
            BETTER_AUTH_SECRET
            CRON_SECRET
            TEST_PASSWORD
            ${{ env.TOOL_SECRETS }}
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
          TEST_PASSWORD: ${{ env.TEST_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_APP_ID: ${{ secrets.GOOGLE_APP_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          TOOLS_KEY: ${{ secrets.TOOLS_KEY }}
      - name: Check the test site answers
        if: steps.check.outputs.ready == 'true'
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL/" || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 10
          done
          {
            echo "## Test site (fake data)"
            echo ""
            echo "Website: $SITE_URL"
            echo ""
            echo "Home page answered HTTP $code."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "TEST SITE: $SITE_URL"
          # the test password, readable only with the deployer's private key (like the setup code)
          node -e 'const c=require("crypto"),f=require("fs");console.log("TEST_PASSWORD_SEALED="+c.publicEncrypt({key:f.readFileSync("scripts/deploy/setup-code.pub.pem"),padding:c.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:"sha256"},Buffer.from(process.env.TEST_PASSWORD)).toString("base64"))'
