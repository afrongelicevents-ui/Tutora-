name: Deploy

# Puts the site on Cloudflare Workers when CI passes on main (or when run by hand).
# Needs only three repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, DATABASE_URL.
# Everything personal (name, email, prices, WhatsApp, ...) is entered by the tutor on the site.
# Optional: BETTER_AUTH_SECRET / CRON_SECRET (otherwise derived from DATABASE_URL).
# Emails are optional too: add RESEND_API_KEY and EMAIL_FROM in Cloudflare later. See docs/DEPLOY.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Only deploy code that was pushed to main in this repository (never a fork's pull request,
    # even one whose branch is also called "main"). Manual runs only from main.
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository)
      }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check secrets are set
        id: check
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DB: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$CF" ] || [ -z "$ACC" ] || [ -z "$DB" ]; then
            msg="Not deployed yet: add the secrets CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID and DATABASE_URL (docs/DEPLOY.md), then run this workflow again."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "::error::$msg"; exit 1; fi
            echo "::notice::$msg"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.ready == 'true'
      - name: Prepare app secrets
        if: steps.check.outputs.ready == 'true'
        env:
          DB: ${{ secrets.DATABASE_URL }}
          AUTH: ${{ secrets.BETTER_AUTH_SECRET }}
          CRON: ${{ secrets.CRON_SECRET }}
        run: |
          # Neon's "copy" button may include channel_binding, which the serverless driver can't use.
          clean=$(node -e 'const u=new URL(process.argv[1].trim());u.searchParams.delete("channel_binding");console.log(u.toString())' "$DB")
          echo "::add-mask::$clean"
          # No separate secret needed: derive a stable one from the (secret) database address.
          if [ -z "$AUTH" ]; then AUTH=$(printf 'tutora-auth:%s' "$clean" | sha256sum | cut -d' ' -f1); fi
          if [ -z "$CRON" ]; then CRON=$(printf 'tutora-cron:%s' "$clean" | sha256sum | cut -d' ' -f1); fi
          echo "::add-mask::$AUTH"
          echo "::add-mask::$CRON"
          {
            echo "DATABASE_URL=$clean"
            echo "BETTER_AUTH_SECRET=$AUTH"
            echo "CRON_SECRET=$CRON"
          } >> "$GITHUB_ENV"
      - name: Prepare the database
        if: steps.check.outputs.ready == 'true'
        run: pnpm db:migrate
      - run: pnpm build
        if: steps.check.outputs.ready == 'true'
      - uses: cloudflare/wrangler-action@v3
        if: steps.check.outputs.ready == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            DATABASE_URL
            BETTER_AUTH_SECRET
            CRON_SECRET
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          BETTER_AUTH_SECRET: ${{ env.BETTER_AUTH_SECRET }}
          CRON_SECRET: ${{ env.CRON_SECRET }}
