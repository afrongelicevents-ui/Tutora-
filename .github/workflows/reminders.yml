name: Lesson reminders

# Every hour, ask the site to email lesson reminders (24 h and 1 h before).
# Does nothing until the repository secrets SITE_URL and CRON_SECRET are set
# (the same CRON_SECRET must be set on Cloudflare). See docs/DEPLOY.md.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send due reminders
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Reminders not set up yet (SITE_URL / CRON_SECRET missing). Skipping."
            exit 0
          fi
          curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
