name: Lesson reminders

# Every hour: reminders 24 h and 1 h before each lesson (to students and the tutor) and
# "homework due tomorrow", shown in Tutora's notifications. Needs only the NEON_API_KEY
# secret already used for deploys (the job finds the live database itself).

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        id: check
        env:
          NEON: ${{ secrets.NEON_API_KEY }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$NEON" ] || [ -z "$CF" ]; then
            echo "Reminders not set up yet (NEON_API_KEY / CLOUDFLARE_API_TOKEN missing). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.ready == 'true'
      - name: Find the database
        if: steps.check.outputs.ready == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: node scripts/deploy/neon.mjs
      - name: Find the website address
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy/cloudflare.mjs
      - name: Send due reminders
        if: steps.check.outputs.ready == 'true'
        run: node_modules/.bin/tsx scripts/deploy/reminders.ts
