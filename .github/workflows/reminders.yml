name: Hourly jobs

# Every hour, everything Tutora does on a timer: lesson reminders (24 h and 1 h before),
# "homework due tomorrow", study-time alerts for parents, the weekly family report, check-in
# follow-ups and day summaries, planner mornings and shared check-in notes. It talks to the
# database directly, so none of this uses the Cloudflare Workers free limits
# (docs/FREE-LIMITS.md). Needs only the secrets already used for deploys; emails go out too
# once RESEND_API_KEY is set. Runs for the live site and for the test site.

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  remind:
    strategy:
      fail-fast: false
      matrix:
        site: [live, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets are set
        id: check
        env:
          NEON: ${{ secrets.NEON_API_KEY }}
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$NEON" ] || [ -z "$CF" ]; then
            echo "Reminders not set up yet (NEON_API_KEY / CLOUDFLARE_API_TOKEN missing). Skipping."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.site }}" = "test" ] && [ "${{ github.event_name }}" = "schedule" ] && [ $(( $(date -u +%H) % 6 )) -ne 0 ]; then
            # the test database shares the live one's free compute hours: every 6 hours is enough
            echo "Test site: runs every 6 hours. Skipping this hour."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'
        with:
          ref: main
      - uses: pnpm/action-setup@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.check.outputs.ready == 'true'
      - name: Find the database
        if: steps.check.outputs.ready == 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          BRANCH: ${{ matrix.site == 'test' && 'test' || '' }}
        run: node scripts/deploy/neon.mjs
      - name: Find the website address
        if: steps.check.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME: ${{ matrix.site == 'test' && 'tutora-test' || 'tutora' }}
        run: node scripts/deploy/cloudflare.mjs
      - name: Run the hourly jobs
        if: steps.check.outputs.ready == 'true'
        env:
          RESEND_API_KEY: ${{ matrix.site == 'live' && secrets.RESEND_API_KEY || '' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node_modules/.bin/tsx scripts/deploy/reminders.ts
      - name: Check usage against the free limits
        if: steps.check.outputs.ready == 'true'
        env:
          SITE: ${{ matrix.site }}
          WORKER: ${{ matrix.site == 'test' && 'tutora-test' || 'tutora' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          RESEND_API_KEY: ${{ matrix.site == 'live' && secrets.RESEND_API_KEY || '' }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: node_modules/.bin/tsx scripts/deploy/usage.ts
